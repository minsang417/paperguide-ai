name: Daily Paper Ingest

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  daily-ingest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          FEEDBACK_SECRET_KEY: ${{ secrets.FEEDBACK_SECRET_KEY }}
          FEEDBACK_SERVER_URL: ${{ secrets.FEEDBACK_SERVER_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          run: |
            python -m collectors.paper_collector
            python -m collectors.openalex_collector
            python -m scripts.daily_ingest