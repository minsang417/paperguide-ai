name: Daily Paper Ingest

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"
    - cron: "0 6 * * *"
    - cron: "0 12 * * *"
    - cron: "0 18 * * *"

concurrency:
  group: daily-ingest
  cancel-in-progress: false

jobs:
  daily-ingest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect PubMed papers and run ingest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SENDER_APP_PASSWORD: ${{ secrets.SENDER_APP_PASSWORD }}
          FEEDBACK_SECRET_KEY: ${{ secrets.FEEDBACK_SECRET_KEY }}
          FEEDBACK_SERVER_URL: ${{ secrets.FEEDBACK_SERVER_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: |
          python -m collectors.paper_collector --days 1 --max-total 30
          python -m scripts.daily_ingest